name: release-termux

on:
  push:
    tags:
      - "v*-termux*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to release, for example v0.24.0-termux.1
        required: true
        type: string
      build_vulkan:
        description: Build Vulkan backend when not reusing release libraries
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NDK_VERSION: r27c
      NDK_DIR: ${{ github.workspace }}/android-ndk/android-ndk-r27c
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*-termux*) ;;
            *) echo "Invalid release tag: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file glslc ninja-build python3 unzip vulkan-headers

      - name: Verify public release safety
        run: bash .github/scripts/verify-public-release-safety.sh

      - name: Download Android NDK
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$NDK_DIR")"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d "$(dirname "$NDK_DIR")"

      - name: Build Android release assets
        env:
          NDK_ROOT: ${{ env.NDK_DIR }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${{ steps.meta.outputs.tag }}"
          REUSE_TAG="$(node -p "require('./package.json').termuxReuseReleaseTag || ''")"
          if [ -n "$REUSE_TAG" ]; then
            export TERMUX_REUSE_RELEASE_TAG="$REUSE_TAG"
          else
            export BUILD_VULKAN="${{ inputs.build_vulkan || '1' }}"
          fi
          ./scripts/build_termux.sh

      - name: Verify release assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/ollama-termux-${VERSION}-android-arm64.tar.gz"
          test -f "dist/ollama-termux-${VERSION}-android-arm64.tar.gz.sha256"
          tar -tzf "dist/ollama-termux-${VERSION}-android-arm64.tar.gz" | grep -qx './bin/ollama'
          tar -tzf "dist/ollama-termux-${VERSION}-android-arm64.tar.gz" | grep -qx './lib/ollama/libggml-cpu-android_armv8_0_1.so'

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          export TERMUX_VERSION="$VERSION"
          export UPSTREAM_TAG="v${VERSION%%-termux*}"
          export TERMUX_REUSE_RELEASE_TAG="$(node -p "require('./package.json').termuxReuseReleaseTag || ''")"
          python3 .github/scripts/generate_termux_release_notes.py "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
