name: release-termux

concurrency:
  group: release-termux-${{ github.ref }}-${{ inputs.publish_release || 'tag' }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*-termux*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to release, for example v0.24.0-termux.1
        required: true
        type: string
      source_ref:
        description: Ref to build for verify-only dispatch, defaults to the selected branch or tag
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish the GitHub release after building assets
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      build_vulkan:
        description: Build Vulkan backend when not reusing release libraries
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NDK_VERSION: r27c
      NDK_DIR: ${{ github.workspace }}/android-ndk/android-ndk-r27c
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            CHECKOUT_REF="${{ inputs.source_ref }}"
            PUBLISH_RELEASE="${{ inputs.publish_release }}"
            BUILD_VULKAN="${{ inputs.build_vulkan }}"
            if [ -z "$CHECKOUT_REF" ]; then
              CHECKOUT_REF="${GITHUB_REF_NAME}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            CHECKOUT_REF="$TAG"
            PUBLISH_RELEASE="1"
            BUILD_VULKAN="1"
          fi
          case "$TAG" in
            v*-termux*) ;;
            *) echo "Invalid release tag: $TAG"; exit 1 ;;
          esac
          case "$PUBLISH_RELEASE" in
            0|1) ;;
            *) echo "Invalid publish_release: $PUBLISH_RELEASE"; exit 1 ;;
          esac
          case "$BUILD_VULKAN" in
            0|1) ;;
            *) echo "Invalid build_vulkan: $BUILD_VULKAN"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "build_vulkan=$BUILD_VULKAN" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file glslc libvulkan-dev ninja-build python3 unzip

      - name: Verify public release safety
        run: bash .github/scripts/verify-public-release-safety.sh

      - name: Download Android NDK
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$NDK_DIR")"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d "$(dirname "$NDK_DIR")"

      - name: Build Android release assets
        env:
          NDK_ROOT: ${{ env.NDK_DIR }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${{ steps.meta.outputs.tag }}"
          REUSE_TAG="$(node -p "require('./package.json').termuxReuseReleaseTag || ''")"
          if [ -n "$REUSE_TAG" ]; then
            export TERMUX_REUSE_RELEASE_TAG="$REUSE_TAG"
          else
            export BUILD_VULKAN="${{ steps.meta.outputs.build_vulkan }}"
          fi
          ./scripts/build_termux.sh

      - name: Verify release assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/ollama-termux-${VERSION}-android-arm64.tar.gz"
          test -f "dist/ollama-termux-${VERSION}-android-arm64.tar.gz.sha256"
          tar -tzf "dist/ollama-termux-${VERSION}-android-arm64.tar.gz" > "$RUNNER_TEMP/termux-asset-files.txt"
          grep -qx './bin/ollama' "$RUNNER_TEMP/termux-asset-files.txt"
          # llama-server runtime (upstream removed the CGO engines in 0.30.x):
          # the subprocess binary plus base + at least one CPU backend library.
          grep -qx './lib/ollama/llama-server' "$RUNNER_TEMP/termux-asset-files.txt"
          grep -qE '^\./lib/ollama/libggml-base\.so$' "$RUNNER_TEMP/termux-asset-files.txt"
          grep -qE '^\./lib/ollama/libggml-cpu.*\.so$' "$RUNNER_TEMP/termux-asset-files.txt"
          if [ "${{ steps.meta.outputs.build_vulkan }}" = "1" ]; then
            grep -qE '^\./lib/ollama/.*libggml-vulkan.*\.so$' "$RUNNER_TEMP/termux-asset-files.txt"
          fi

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          export TERMUX_VERSION="$VERSION"
          export UPSTREAM_TAG="v${VERSION%%-termux*}"
          export TERMUX_REUSE_RELEASE_TAG="$(node -p "require('./package.json').termuxReuseReleaseTag || ''")"
          python3 .github/scripts/generate_termux_release_notes.py "$RUNNER_TEMP/release-notes.md"

      - name: Upload release assets for audit
        uses: actions/upload-artifact@v4
        with:
          name: ollama-termux-${{ steps.meta.outputs.tag }}-android-arm64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.meta.outputs.publish_release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
