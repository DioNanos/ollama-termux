name: package-validation

on:
  pull_request:
    paths:
      - "install.js"
      - "tests/install.test.js"
      - "package.json"
      - ".npmignore"
      - "README.md"
      - "docs/BUILDING.md"
      - ".github/workflows/release.yaml"
      - ".github/workflows/npm-publish.yaml"
      - ".github/workflows/test-install.yaml"

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate installer syntax
        run: node -c install.js

      - name: Run installer security tests
        run: npm run test:installer

      - name: Verify public release safety
        run: bash .github/scripts/verify-public-release-safety.sh

      - name: Validate npm package contents
        run: npm pack --dry-run
